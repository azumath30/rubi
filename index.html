<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>縦書き教科書 ルビ振りリーダー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

        body {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            background-color: #f7f6f2;
            color: #2b2b2b;
        }

        .font-mincho {
            font-family: 'Shippori Mincho', serif;
        }

        /* 縦書きのコアスタイル */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            -webkit-writing-mode: vertical-rl;
            -ms-writing-mode: vertical-rl;
        }

        /* ルビのスタイリング */
        ruby {
            ruby-align: space-around;
        }

        rt {
            font-size: 0.55em;
            color: #e53e3e; /* 見やすい赤朱色 */
            font-weight: bold;
            font-family: 'Zen Kaku Gothic New', sans-serif;
        }

        /* 縦書きコンテナのスクロール設定 */
        .vertical-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
        }

        /* 和紙風背景テクスチャ */
        .washi-bg {
            background-color: #fbf9f5;
            background-image: radial-gradient(#e5e0d8 0.75px, transparent 0.75px);
            background-size: 12px 12px;
        }

        /* カスタムスクロールバー（横スクロール用） */
        .vertical-scroll::-webkit-scrollbar {
            height: 8px;
        }
        .vertical-scroll::-webkit-scrollbar-track {
            background: #eae6df;
            border-radius: 4px;
        }
        .vertical-scroll::-webkit-scrollbar-thumb {
            background: #a8a29e;
            border-radius: 4px;
        }
        .vertical-scroll::-webkit-scrollbar-thumb:hover {
            background: #78716c;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-stone-800 text-stone-100 shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="ri-book-read-line text-2xl text-amber-400"></i>
                <h1 class="text-xl font-bold font-mincho tracking-wider">縦書きルビえもん</h1>
            </div>
            <div class="text-xs text-stone-400 hidden sm:block">
                国語教科書・古文・漢文の読み取りとルビ振り
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- 左側：入力・カメラコントロールエリア (5/12) -->
        <section class="lg:col-span-5 flex flex-col space-y-4">
            
            <!-- カメラ / 画像撮影カード -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-stone-200">
                <h2 class="text-lg font-bold mb-3 text-stone-700 flex items-center">
                    <i class="ri-camera-fill mr-2 text-amber-600"></i> 教科書を撮影・選択
                </h2>

                <!-- プレビュー／カメラエリア -->
                <div id="image-container" class="relative w-full h-56 bg-stone-100 rounded-xl overflow-hidden border-2 border-dashed border-stone-300 flex flex-col justify-center items-center group">
                    <img id="image-preview" class="absolute inset-0 w-full h-full object-contain hidden" alt="撮影プレビュー">
                    
                    <div id="upload-placeholder" class="text-center p-4">
                        <i class="ri-image-add-line text-4xl text-stone-400 mb-2 block"></i>
                        <p class="text-sm text-stone-600 font-medium">写真を撮るかファイルを選択</p>
                        <p class="text-xs text-stone-400 mt-1">縦書きテキストが含まれる画像をアップロード</p>
                    </div>

                    <!-- 読み込み中オーバーレイ -->
                    <div id="ocr-loading" class="absolute inset-0 bg-stone-900/70 text-white flex flex-col items-center justify-center hidden backdrop-blur-sm">
                        <div class="animate-spin rounded-full h-10 w-10 border-4 border-amber-400 border-t-transparent mb-3"></div>
                        <p class="text-sm font-semibold">文字を解析中...</p>
                        <p class="text-xs text-stone-300 mt-1">縦書きレイアウトを検出しています</p>
                    </div>
                </div>

                <!-- アクションボタン -->
                <div class="grid grid-cols-2 gap-3 mt-4">
                    <label class="cursor-pointer bg-amber-500 hover:bg-amber-600 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center text-sm transition shadow-sm">
                        <i class="ri-camera-3-line mr-2 text-lg"></i>
                        <span>写真を撮る</span>
                        <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">
                    </label>
                    <label class="cursor-pointer bg-stone-700 hover:bg-stone-800 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center text-sm transition shadow-sm">
                        <i class="ri-folder-open-line mr-2 text-lg"></i>
                        <span>画像を選択</span>
                        <input type="file" id="file-input" accept="image/*" class="hidden">
                    </label>
                </div>

                <!-- サンプル画像ボタン -->
                <div class="mt-3 pt-3 border-t border-stone-100 flex items-center justify-between text-xs text-stone-500">
                    <span>サンプルで試す:</span>
                    <div class="space-x-1">
                        <button onclick="loadSample(1)" class="px-2 py-1 bg-stone-100 hover:bg-stone-200 rounded text-stone-700 font-medium transition">走れメロス</button>
                        <button onclick="loadSample(2)" class="px-2 py-1 bg-stone-100 hover:bg-stone-200 rounded text-stone-700 font-medium transition">竹取物語</button>
                    </div>
                </div>
            </div>

            <!-- 手動テキスト入力／検出結果編集 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-stone-200 flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-bold text-stone-700 flex items-center">
                        <i class="ri-edit-line mr-2 text-amber-600"></i> テキスト編集
                    </h2>
                    <button id="clear-btn" class="text-xs text-stone-400 hover:text-red-500 transition">
                        <i class="ri-delete-bin-line mr-1"></i>消去
                    </button>
                </div>
                <textarea id="text-input" rows="6" class="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none resize-none text-sm leading-relaxed text-stone-800" placeholder="撮影した画像から検出された文章がここに表示されます。直接打ち込んでルビを振ることもできます。"></textarea>
                <button id="process-btn" class="mt-3 w-full bg-stone-800 hover:bg-stone-900 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center text-sm transition">
                    <i class="ri-text-spacing mr-2 text-amber-400"></i>
                    <span>ルビを最新化する</span>
                </button>
            </div>

        </section>

        <!-- 右側：縦書き表示エリア (7/12) -->
        <section class="lg:col-span-7 flex flex-col">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-stone-200 flex-1 flex flex-col h-full min-h-[500px]">
                
                <!-- ツールバー -->
                <div class="flex flex-wrap justify-between items-center pb-4 mb-4 border-b border-stone-200 gap-2">
                    <div class="flex items-center space-x-2">
                        <i class="ri-book-open-line text-amber-600 text-xl"></i>
                        <h2 class="text-lg font-bold font-mincho text-stone-800">縦書きルビ表示</h2>
                    </div>

                    <!-- 表示コントロール -->
                    <div class="flex items-center space-x-3 text-xs">
                        <!-- 文字サイズ -->
                        <div class="flex items-center bg-stone-100 rounded-lg p-1">
                            <button id="font-decrease" class="w-7 h-7 flex items-center justify-center text-stone-600 hover:bg-white rounded transition"><i class="ri-subtract-line"></i></button>
                            <span id="font-size-label" class="px-2 font-medium text-stone-700">20px</span>
                            <button id="font-increase" class="w-7 h-7 flex items-center justify-center text-stone-600 hover:bg-white rounded transition"><i class="ri-add-line"></i></button>
                        </div>

                        <!-- ルビ色切り替え -->
                        <div class="flex items-center space-x-1 bg-stone-100 rounded-lg p-1">
                            <button onclick="setRubyColor('#e53e3e')" class="w-5 h-5 rounded-full bg-red-600 border border-white shadow-sm" title="赤ルビ"></button>
                            <button onclick="setRubyColor('#2b6cb0')" class="w-5 h-5 rounded-full bg-blue-600 border border-white shadow-sm" title="青ルビ"></button>
                            <button onclick="setRubyColor('#2f855a')" class="w-5 h-5 rounded-full bg-green-600 border border-white shadow-sm" title="緑ルビ"></button>
                            <button onclick="setRubyColor('#4a5568')" class="w-5 h-5 rounded-full bg-gray-600 border border-white shadow-sm" title="黒ルビ"></button>
                        </div>
                    </div>
                </div>

                <!-- 縦書き表示本体（和紙風背景） -->
                <div class="flex-1 washi-bg rounded-xl border border-stone-200 p-6 relative overflow-hidden flex justify-end">
                    
                    <!-- 空状態のアラート -->
                    <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-stone-400 p-6 text-center">
                        <i class="ri-book-2-line text-5xl mb-3 text-stone-300"></i>
                        <p class="font-mincho text-lg text-stone-500">教科書の写真を撮るか、<br>左側のエリアにテキストを入力してください</p>
                        <p class="text-xs text-stone-400 mt-2">右から左へと流れる縦書きでルビが付きます</p>
                    </div>

                    <!-- 縦書きスクロールコンテナ -->
                    <div id="vertical-output-container" class="w-full h-full vertical-scroll hidden flex justify-end">
                        <div id="vertical-output" class="vertical-text font-mincho leading-loose tracking-widest text-stone-900 p-4 min-h-full" style="font-size: 20px;">
                            <!-- 動的に生成されたルビ付きHTMLが入ります -->
                        </div>
                    </div>

                </div>

                <!-- フッター操作説明 -->
                <div class="mt-4 flex justify-between items-center text-xs text-stone-500">
                    <span class="flex items-center"><i class="ri-information-line mr-1"></i> スクロールで右から左へ移動できます</span>
                    <button id="copy-btn" class="hover:text-amber-600 font-medium transition flex items-center">
                        <i class="ri-file-copy-line mr-1"></i>テキストをコピー
                    </button>
                </div>

            </div>
        </section>

    </main>

    <div id="toast" class="fixed bottom-5 right-5 bg-stone-800 text-white px-4 py-2 rounded-xl text-sm shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center space-x-2">
        <i class="ri-checkbox-circle-fill text-green-400 text-lg"></i>
        <span id="toast-msg">通知メッセージ</span>
    </div>

    <script>
        // Dictionary for Kanji to Hiragana conversion (Client-side mock dictionary for common textbook kanji)
        // 実運用ではKuromoji.jsや外部API（Furigana API）などを組み込む拡張が可能です。
        const MOCK_DICTIONARY = {
            "走れメロス": "はしれメロス",
            "メロスは": "メロスは",
            "激怒した": "げきどした",
            "必ず": "かならず",
            "邪智": "じゃち",
            "暴虐": "ぼうぎゃく",
            "王": "おう",
            "除かなければ": "のぞかなければ",
            "決意した": "けついした",
            "竹取物語": "たけとりものがたり",
            "いまは": "いまは",
            "昔": "むかし",
            "竹取": "たけとり",
            "翁": "おきな",
            "いふ": "いふ",
            "もの": "もの",
            "ありけり": "ありけり",
            "野山": "のやま",
            "まじりて": "まじりて",
            "竹を": "たけを",
            "取りつつ": "とりつつ",
            "よろづの": "よろづの",
            "事に": "ことに",
            "使ひけり": "つかいけり",
            "国語": "こくご",
            "教科書": "きょうかしょ",
            "縦書き": "たてがき",
            "学習": "がくしゅう",
            "読解": "どっかい",
            "漢字": "かんじ",
            "振り仮名": "ふりがな",
            "文章": "ぶんしょう",
            "学校": "がっこう",
            "先生": "せんせい",
            "児童": "じどう",
            "生徒": "せいと"
        };

        // サンプルデータ
        const SAMPLE_TEXTS = {
            1: "走れメロス\n太宰治\n\nメロスは激怒した。必ず、かの邪智暴虐の王を除かなければならぬと決意した。メロスには政治がわからぬ。メロスは、村の牧人である。笛を吹き、羊と遊んで暮して来た。けれども邪悪に対しては、人一倍に敏感であった。",
            2: "竹取物語\n\nいまは昔、竹取の翁といふものありけり。野山にまじりて竹を取りつつ、よろづの事に使ひけり。名をば、さぬきの造となむいひける。その竹の中に、もと光る竹なむ一筋ありける。あやしがりて、寄りて見るに、筒の中光りたり。それを見れば、三寸ばかりなる人、いとうつくしうてゐたり。"
        };

        // UI Element References
        const cameraInput = document.getElementById('camera-input');
        const fileInput = document.getElementById('file-input');
        const imagePreview = document.getElementById('image-preview');
        const uploadPlaceholder = document.getElementById('upload-placeholder');
        const ocrLoading = document.getElementById('ocr-loading');
        const textInput = document.getElementById('text-input');
        const processBtn = document.getElementById('process-btn');
        const verticalOutput = document.getElementById('vertical-output');
        const verticalOutputContainer = document.getElementById('vertical-output-container');
        const emptyState = document.getElementById('empty-state');
        const clearBtn = document.getElementById('clear-btn');
        const fontIncrease = document.getElementById('font-increase');
        const fontDecrease = document.getElementById('font-decrease');
        const fontSizeLabel = document.getElementById('font-size-label');
        const copyBtn = document.getElementById('copy-btn');

        let currentFontSize = 20;

        // --- Event Listeners ---

        // カメラ・ファイル選択イベント
        cameraInput.addEventListener('change', handleImageUpload);
        fileInput.addEventListener('change', handleImageUpload);

        // テキスト処理
        processBtn.addEventListener('change', () => generateVerticalFurigana());
        processBtn.addEventListener('click', () => {
            generateVerticalFurigana();
            showToast('ルビを更新しました');
        });

        // テキストクリア
        clearBtn.addEventListener('click', () => {
            textInput.value = '';
            imagePreview.src = '';
            imagePreview.classList.add('hidden');
            uploadPlaceholder.classList.remove('hidden');
            generateVerticalFurigana();
            showToast('内容をクリアしました');
        });

        // フォントサイズ変更
        fontIncrease.addEventListener('click', () => {
            if (currentFontSize < 36) {
                currentFontSize += 2;
                updateFontSize();
            }
        });

        fontDecrease.addEventListener('click', () => {
            if (currentFontSize > 12) {
                currentFontSize -= 2;
                updateFontSize();
            }
        });

        // クリップボードコピー
        copyBtn.addEventListener('click', () => {
            const text = textInput.value;
            if (!text) return;
            
            // iFrame制約対応用のコピー処理
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = text;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextArea);

            showToast('テキストをコピーしました');
        });

        // --- Core Functions ---

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            // プレビュー表示
            const reader = new FileReader();
            reader.onload = function(event) {
                imagePreview.src = event.target.result;
                imagePreview.classList.remove('hidden');
                uploadPlaceholder.classList.add('hidden');
                
                // OCR解析シミュレーションを開始
                simulateOCR();
            };
            reader.readAsDataURL(file);
        }

        // OCR処理を模倣（実際の実装ではTesseract.jsやGoogle Cloud Vision API等を呼び出せます）
        function simulateOCR() {
            ocrLoading.classList.remove('hidden');
            
            setTimeout(() => {
                ocrLoading.classList.add('hidden');
                
                // サンプルテキストまたは擬似認識テキストを入力欄へ設定
                const randomSample = Math.random() > 0.5 ? SAMPLE_TEXTS[1] : SAMPLE_TEXTS[2];
                textInput.value = randomSample;
                
                // ルビの自動生成
                generateVerticalFurigana();
                showToast('教科書のテキストを認識しました');
            }, 1500);
        }

        // サンプルテキスト読込
        function loadSample(id) {
            textInput.value = SAMPLE_TEXTS[id];
            imagePreview.classList.add('hidden');
            uploadPlaceholder.classList.remove('hidden');
            generateVerticalFurigana();
            showToast('サンプルを読み込みました');
        }

        function generateVerticalFurigana() {
            const text = textInput.value.trim();

            if (!text) {
                emptyState.classList.remove('hidden');
                verticalOutputContainer.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            verticalOutputContainer.classList.remove('hidden');

            // 簡易ルビ振りエンジン (漢字ブロック検出 & マッチング)
            let formattedHtml = text.split('\n').map(line => {
                if (!line.trim()) return '<div class="h-8"></div>'; // 改行スペース

                let processedLine = '';
                let i = 0;

                while (i < line.length) {
                    let matched = false;

                    // 辞書に一致する熟語を探す（長い単語を優先）
                    for (let len = 6; len >= 1; len--) {
                        if (i + len <= line.length) {
                            const sub = line.substr(i, len);
                            if (MOCK_DICTIONARY[sub]) {
                                processedLine += `<ruby>${sub}<rt>${MOCK_DICTIONARY[sub]}</rt></ruby>`;
                                i += len;
                                matched = true;
                                break;
                            }
                        }
                    }

                    // 辞書にない場合は漢字単体判定
                    if (!matched) {
                        const char = line[i];
                        if (isKanji(char)) {
                            // ダミールビ生成（実用時はKuromoji等を利用）
                            const mockFurigana = getMockFuriganaForChar(char);
                            processedLine += `<ruby>${char}<rt>${mockFurigana}</rt></ruby>`;
                        } else {
                            // 句読点・かなはそのまま出力
                            processedLine += formatPunctuation(char);
                        }
                        i++;
                    }
                }

                return `<p class="mb-6">${processedLine}</p>`;
            }).join('');

            verticalOutput.innerHTML = formattedHtml;
        }

        // 漢字判定関数
        function isKanji(ch) {
            return (ch >= '一' && ch <= '龥') || (ch >= '豈' && ch <= '鶴');
        }

        // 単一漢字への仮ルビ付与（デモ用アルゴリズム）
        function getMockFuriganaForChar(kanji) {
            const commonReadings = {
                "激": "げき", "怒": "ど", "必": "かなら", "邪": "じゃ", "智": "ち",
                "暴": "ぼう", "虐": "ぎゃく", "除": "のぞ", "決": "けつ", "意": "い",
                "政": "せい", "治": "じ", "村": "むら", "牧": "ぼく", "人": "じん",
                "笛": "ふえ", "吹": "ふ", "羊": "ひつじ", "遊": "あそ", "暮": "く",
                "対": "たい", "倍": "ばい", "敏": "びん", "感": "かん", "治": "おさ",
                "太": "たい", "宰": "さい", "治": "おさむ"
            };
            return commonReadings[kanji] || "・";
        }

        // 縦書き時の句読点・記号の整形
        function formatPunctuation(char) {
            if (char === '―' || char === 'ー') {
                return '<span class="inline-block transform rotate-90">｜</span>';
            }
            return char;
        }

        // フォントサイズ更新
        function updateFontSize() {
            verticalOutput.style.fontSize = `${currentFontSize}px`;
            fontSizeLabel.textContent = `${currentFontSize}px`;
        }

        // ルビの色変更
        function setRubyColor(color) {
            const style = document.createElement('style');
            style.innerHTML = `rt { color: ${color} !important; }`;
            document.head.appendChild(style);
            showToast('ルビの色を変更しました');
        }

        // トースト通知表示
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.textContent = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // 初期表示の設定
        window.onload = function() {
            loadSample(1);
        };
    </script>
</body>
</html>
